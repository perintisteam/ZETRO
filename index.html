<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zetro</title>
    <link rel="icon" type="image/svg+xml" href="./assets/logo.svg" />
    <link rel="apple-touch-icon" href="./assets/zetro-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body class="flex min-h-screen flex-col">
    <button
      id="settingsBtn"
      type="button"
      class="gpt-btn-soft fixed top-3.5 right-5 z-40 shrink-0 !rounded-xl !p-2.5"
      data-i18n-title="settings"
      data-i18n-aria="settings"
    >
      <svg
        class="h-4 w-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
        />
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
    </button>

    <!-- Record view -->
    <div id="recordView" class="flex min-h-screen flex-col">
      <header class="border-gpt flex items-center justify-between gap-3 border-b px-5 py-3.5 pr-16">
        <div class="flex min-w-0 shrink flex-col">
          <span class="zetro-wordmark">ZETRO</span>
          <p class="text-gpt-muted mt-1 text-xs" data-i18n="tagline">Screen recorder</p>
        </div>

        <div class="flex min-w-0 shrink-0 items-center justify-end gap-2">
          <div
            id="recBadge"
            class="flex hidden items-center gap-2 rounded-full bg-red-50 px-3 py-1.5 ring-1 ring-red-200 dark:bg-red-950/40 dark:ring-red-900/50"
          >
            <span class="recording-pulse h-2 w-2 rounded-full bg-red-500"></span>
            <span class="text-xs font-medium text-red-600 dark:text-red-400" data-i18n="rec"
              >REC</span
            >
            <span id="timer" class="font-mono text-xs text-red-500 tabular-nums dark:text-red-300"
              >00:00</span
            >
          </div>

          <div
            id="previewBadge"
            class="flex hidden items-center gap-1.5 rounded-full bg-emerald-50 px-3 py-1.5 ring-1 ring-emerald-200 dark:bg-emerald-950/30 dark:ring-emerald-800/50"
          >
            <svg
              class="h-3.5 w-3.5 text-emerald-600"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
            <span
              class="text-xs font-medium text-emerald-700 dark:text-emerald-400"
              data-i18n="previewOk"
              >Preview ready</span
            >
          </div>

          <nav
            class="border-gpt bg-gpt-surface flex shrink-0 items-center gap-1 rounded-full border p-1"
          >
            <button
              id="navRecordBtn"
              type="button"
              class="nav-tab nav-tab-active rounded-full px-3 py-1.5 text-xs font-medium"
              data-i18n="navRecord"
            >
              Record
            </button>
            <button
              id="navLibraryBtn"
              type="button"
              class="nav-tab text-gpt-muted rounded-full px-3 py-1.5 text-xs font-medium"
              data-i18n="navLibrary"
            >
              Recordings
            </button>
          </nav>
        </div>
      </header>

      <main class="mx-auto flex w-full max-w-3xl flex-1 flex-col gap-4 p-5">
        <!-- Preview -->
        <section class="gpt-card relative overflow-hidden">
          <div id="previewWrap" class="relative aspect-video w-full overflow-hidden bg-[#0a0a0a]">
            <div
              id="previewViewport"
              class="preview-viewport absolute inset-0 overflow-hidden will-change-transform"
            >
              <video
                id="screenPreview"
                class="h-full w-full object-cover"
                autoplay
                muted
                playsinline
              ></video>
            </div>
            <video
              id="camPreview"
              class="ring-gpt-accent absolute right-3 bottom-3 z-10 hidden w-[18%] max-w-[180px] min-w-[100px] rounded-2xl object-cover shadow-lg ring-2"
              autoplay
              muted
              playsinline
            ></video>
            <canvas
              id="composite"
              class="pointer-events-none absolute opacity-0"
              width="1"
              height="1"
              aria-hidden="true"
            ></canvas>

            <div
              id="idleOverlay"
              class="idle-overlay absolute inset-0 z-20 flex flex-col items-center justify-center gap-3"
            >
              <span class="zetro-wordmark-lg">ZETRO</span>
              <p class="text-gpt-muted text-sm" data-i18n="previewHint">
                Your screen will appear here
              </p>
            </div>
          </div>
        </section>

        <!-- Zoom -->
        <section
          id="zoomBar"
          class="gpt-card flex hidden flex-wrap items-center justify-between gap-3 px-4 py-3"
        >
          <span class="text-gpt-muted text-xs font-medium tracking-wide uppercase" data-i18n="zoom"
            >Zoom</span
          >
          <div class="flex items-center gap-2">
            <button
              id="zoomOutBtn"
              type="button"
              class="gpt-btn-soft !rounded-xl !px-3"
              data-i18n-title="zoomOut"
            >
              −
            </button>
            <button
              id="zoomResetBtn"
              type="button"
              class="gpt-btn-soft !rounded-xl !px-3 text-xs"
              data-i18n="resetZoom"
            >
              Reset
            </button>
            <button
              id="zoomInBtn"
              type="button"
              class="gpt-btn-soft !rounded-xl !px-3"
              data-i18n-title="zoomIn"
            >
              +
            </button>
          </div>
          <p class="text-gpt-muted w-full text-xs sm:w-auto" data-i18n="clickToFocus">
            Click preview to focus zoom
          </p>
        </section>

        <!-- Controls -->
        <section class="gpt-card flex flex-col gap-4 p-4">
          <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <label class="flex flex-col gap-1.5">
              <span class="gpt-field-label" data-i18n="mic">Mic</span>
              <div class="gpt-select-wrap">
                <select id="micSelect" class="gpt-select"></select>
              </div>
            </label>
            <label class="flex flex-col gap-1.5">
              <span class="gpt-field-label" data-i18n="cam">Cam</span>
              <div class="gpt-select-wrap">
                <select id="camSelect" class="gpt-select"></select>
              </div>
            </label>
          </div>

          <div class="flex flex-wrap items-center gap-2">
            <button
              id="micToggle"
              type="button"
              data-on="1"
              class="gpt-btn-soft gpt-toggle-on !rounded-full text-xs"
            ></button>
            <button
              id="camToggle"
              type="button"
              data-on="1"
              class="gpt-btn-soft gpt-toggle-on !rounded-full text-xs"
            ></button>
          </div>

          <div class="flex flex-wrap items-center justify-center gap-3 pt-1">
            <button
              id="selectScreenBtn"
              type="button"
              class="gpt-btn-primary"
              data-i18n="selectScreen"
            >
              Select screen
            </button>
            <button
              id="confirmRecordBtn"
              type="button"
              class="gpt-btn-primary !bg-gpt-accent hover:!bg-gpt-accent-hover hidden"
              data-i18n="startRecord"
            >
              Start recording
            </button>
            <button
              id="cancelPreviewBtn"
              type="button"
              class="gpt-btn-soft hidden"
              data-i18n="cancel"
            >
              Cancel
            </button>

            <button
              id="recordHoldBtn"
              type="button"
              disabled
              class="recording-pulse hidden cursor-default items-center gap-2 rounded-full border border-red-200 bg-red-50 px-5 py-2.5 text-sm font-medium text-red-600 dark:border-red-900/50 dark:bg-red-950/30 dark:text-red-400"
            >
              <span class="h-2 w-2 rounded-full bg-red-500"></span>
              <span data-i18n="recordingHold">Recording</span>
            </button>

            <button
              id="stopBtn"
              type="button"
              disabled
              class="hidden items-center gap-2 rounded-full bg-red-600 px-6 py-2.5 text-sm font-semibold text-white shadow-md shadow-red-600/25 transition hover:bg-red-500 active:scale-[0.98] disabled:opacity-40"
            >
              <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24">
                <rect x="6" y="6" width="12" height="12" rx="1.5" />
              </svg>
              <span data-i18n="stop">Stop</span>
            </button>
          </div>

          <p id="status" class="text-gpt-muted text-center text-sm" data-i18n="ready">Ready.</p>
        </section>
      </main>
    </div>

    <!-- Library view -->
    <div id="libraryView" class="hidden min-h-screen flex-col">
      <header class="border-gpt flex items-center justify-between gap-3 border-b px-5 py-3.5 pr-16">
        <div class="flex min-w-0 shrink flex-col">
          <span class="zetro-wordmark">ZETRO</span>
          <p class="text-gpt-muted mt-1 text-xs" data-i18n="libraryTitle">Your recordings</p>
        </div>
        <nav
          class="border-gpt bg-gpt-surface flex shrink-0 items-center gap-1 rounded-full border p-1"
        >
          <button
            type="button"
            class="nav-to-record nav-tab text-gpt-muted rounded-full px-3 py-1.5 text-xs font-medium"
            data-i18n="navRecord"
          >
            Record
          </button>
          <button
            type="button"
            class="nav-to-library nav-tab nav-tab-active rounded-full px-3 py-1.5 text-xs font-medium"
            data-i18n="navLibrary"
          >
            Recordings
          </button>
        </nav>
      </header>
      <main class="mx-auto flex w-full max-w-3xl flex-1 flex-col gap-4 p-5">
        <div class="flex items-center justify-between gap-2">
          <p class="text-gpt-muted text-sm" data-i18n="libraryHint">Saved in Videos/Zetro</p>
          <button
            id="openRecordingsFolderBtn"
            type="button"
            class="gpt-btn-soft shrink-0 !rounded-xl !text-xs"
            data-i18n="openFolder"
          >
            Open folder
          </button>
        </div>
        <div id="recordingsList" class="flex flex-col gap-2 pb-4"></div>
      </main>
    </div>

    <div
      id="playerModal"
      class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 p-4 backdrop-blur-sm"
    >
      <div class="gpt-card flex w-full max-w-3xl flex-col overflow-hidden shadow-xl">
        <div class="border-gpt flex items-center justify-between border-b px-4 py-3">
          <p id="playerTitle" class="truncate pr-4 text-sm font-medium"></p>
          <button
            id="playerCloseBtn"
            type="button"
            class="gpt-btn-soft !rounded-xl !px-3 !py-1.5 text-xs"
            data-i18n="close"
          >
            Close
          </button>
        </div>
        <video id="playerVideo" class="aspect-video w-full bg-black" controls playsinline></video>
      </div>
    </div>

    <!-- Settings overlay -->
    <div id="settingsView" class="bg-gpt-bg fixed inset-0 z-50 hidden min-h-screen flex-col">
      <header class="border-gpt flex items-center gap-3 border-b px-5 py-3.5">
        <button id="backBtn" type="button" class="gpt-btn-soft !rounded-xl !px-3">
          <svg
            class="h-4 w-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
          </svg>
        </button>
        <h2 class="text-[15px] font-semibold" data-i18n="settings">Settings</h2>
      </header>

      <main class="mx-auto w-full max-w-lg flex-1 space-y-4 p-5">
        <section class="gpt-card space-y-4 p-4">
          <h3
            class="text-gpt-muted text-xs font-medium tracking-wide uppercase"
            data-i18n="appearance"
          >
            Appearance
          </h3>
          <label class="flex flex-col gap-1.5">
            <span class="gpt-field-label" data-i18n="theme">Theme</span>
            <div class="gpt-select-wrap">
              <select id="themeSelect" class="gpt-select">
                <option value="light" data-i18n="themeLight">Light</option>
                <option value="dark" data-i18n="themeDark">Dark</option>
                <option value="system" data-i18n="themeSystem">System</option>
              </select>
            </div>
          </label>
        </section>

        <section class="gpt-card space-y-4 p-4">
          <h3
            class="text-gpt-muted text-xs font-medium tracking-wide uppercase"
            data-i18n="general"
          >
            General
          </h3>
          <label class="flex flex-col gap-1.5">
            <span class="gpt-field-label" data-i18n="language">Language</span>
            <div class="gpt-select-wrap">
              <select id="langSelect" class="gpt-select">
                <option value="id" data-i18n="langId">Indonesia</option>
                <option value="en" data-i18n="langEn">English</option>
              </select>
            </div>
          </label>
          <label class="flex flex-col gap-1.5">
            <span class="text-sm" data-i18n="zoomSpeed">Zoom smoothness</span>
            <input
              id="zoomSmoothSlider"
              type="range"
              min="2"
              max="20"
              value="6"
              class="accent-gpt-accent w-full"
            />
            <p class="text-gpt-muted text-xs" data-i18n="zoomSpeedHint">
              Higher = slower, cinematic
            </p>
          </label>
        </section>
      </main>
    </div>

    <!-- Source picker -->
    <div
      id="sourceModal"
      class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 p-4 backdrop-blur-sm"
    >
      <div class="gpt-card flex max-h-[85vh] w-full max-w-lg flex-col overflow-hidden shadow-xl">
        <div class="border-gpt border-b px-5 py-4">
          <h3 class="text-[15px] font-semibold" data-i18n="pickSourceTitle">
            Choose what to share
          </h3>
          <p class="text-gpt-muted mt-1 text-xs" data-i18n="pickSourceHint">
            Select a screen or window to preview
          </p>
        </div>
        <div id="sourceList" class="grid flex-1 gap-2 overflow-y-auto p-3 sm:grid-cols-2"></div>
        <div
          id="sourceLoading"
          class="text-gpt-muted hidden p-8 text-center text-sm"
          data-i18n="loadingSources"
        >
          Loading…
        </div>
        <div class="border-gpt flex justify-end gap-2 border-t px-4 py-3">
          <button id="sourceCancelBtn" type="button" class="gpt-btn-soft" data-i18n="cancel">
            Cancel
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="./assets/app.js"></script>
  </body>
</html>
